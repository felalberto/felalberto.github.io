<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/codebronx.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-shell nav-wrap">
      <a class="site-brand" href="{{ '/' | relative_url }}">CodeBronx</a>

      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/work/' | relative_url }}">Work</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/collaborate/' | relative_url }}">Collaborate</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-wrap">
      <span>CodeBronx</span>
      <span>Bronx, New York</span>
    </div>
  </footer>
</body>
</html>
